name: Current POSIX owner V3 native regressions

on:
  push:
    branches:
      - codex/acyclic-b-platform-20261109
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-controls:
    name: V3 engineering / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ runner.os == 'macOS' && '3.14.10' || '3.12' }}
      - name: Observe held macOS leader identity without changing acceptance
        if: runner.os == 'macOS'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -I -B -X utf8 test/initial_reference/diagnose_darwin_identity_v3.py --output-directory "$RUNNER_TEMP/solarsindy-posix-v3-identity"
      - name: Run bounded independent current-source controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -B -X utf8 test/run_posix_owner_v3_controls.py --output-directory "$RUNNER_TEMP/solarsindy-posix-v3-direct"
      - name: Run independent launch-anchor and cancellation controls
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -I -B -X utf8 test/run_darwin_anchor_v1_controls.py --output-directory "$RUNNER_TEMP/solarsindy-darwin-anchor-v1-direct"
      - name: Retain engineering evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-v3-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solarsindy-posix-v3-direct
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Retain macOS identity observations including negative results
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: posix-v3-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solarsindy-posix-v3-identity
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Retain launch-anchor evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-anchor-v1-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solarsindy-darwin-anchor-v1-direct
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
