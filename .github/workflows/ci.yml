name: CI

on:
  push:
    branches: [main, codex/acyclic-b-platform-20261109]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: '1'
  JULIA_NUM_PRECOMPILE_TASKS: '1'
  JULIA_PKG_PRECOMPILE_AUTO: '0'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  SOLARSINDY_NO_OPEN: '1'

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12.6', '1.13.1']
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check available memory before Julia setup
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              available=$(awk '/^MemAvailable:/ {printf "%.0f\n", $2 * 1024}' /proc/meminfo)
              ;;
            Windows)
              available=$(powershell -NoLogo -NoProfile -NonInteractive -Command \
                '([UInt64](Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory * 1024).ToString()' | tr -d '\r')
              ;;
            macOS)
              available=$(/usr/bin/vm_stat | awk '
                /page size of/ {page = $8}
                /^Pages free:/ {gsub(/\./, "", $3); free = $3; have_free = 1}
                /^Pages speculative:/ {gsub(/\./, "", $3); speculative = $3; have_speculative = 1}
                END {
                  if (page > 0 && have_free && have_speculative) printf "%.0f\n", (free + speculative) * page
                  else exit 1
                }')
              ;;
            *) exit 1 ;;
          esac
          [[ "$available" =~ ^[0-9]+$ ]] && (( available >= 8589934592 )) || {
            echo 'At least 8 GiB of available physical memory is required.' >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ runner.os == 'macOS' && '3.14' || '3.12' }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: 'default'
      - uses: julia-actions/cache@v2
      - name: Instantiate and build the package
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve(); Pkg.instantiate(); Pkg.build()'
      - name: Run the package tests
        uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.13.1' }}
      - name: Run examples and load the bundled models
        run: julia --startup-file=no --project=. examples/experiments.jl
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.13.1'
        with:
          node-version: '22'
      - name: Test the dashboard frontend
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.13.1'
        run: node --test --test-reporter=tap app/test/frontend_freshness.cjs
      - name: Check that tracked source files are unchanged
        run: git diff --exit-code

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check available memory before Julia setup
        run: |
          available=$(awk '/^MemAvailable:/ {printf "%.0f\n", $2 * 1024}' /proc/meminfo)
          [[ "$available" =~ ^[0-9]+$ ]] && (( available >= 8589934592 ))
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@v2
      - name: Instantiate the documentation environment
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve(); Pkg.instantiate()'
      - name: Build the manual (Julia 1.12.6)
        run: julia --startup-file=no --project=docs -e 'VERSION == v"1.12.6" || error("unexpected documentation runtime"); include("docs/make.jl")'
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.1'
      - name: Build the manual (Julia 1.13.1)
        run: julia --startup-file=no --project=docs -e 'VERSION == v"1.13.1" || error("unexpected documentation runtime"); include("docs/make.jl")'
      - name: Check that tracked source files are unchanged
        run: git diff --exit-code
