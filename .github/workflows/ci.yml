name: CI

# Generated study artifacts are deliberately absent from each clean checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Allow the expanded cold native controls, full package suite and experiments.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12.6', '1.13.1']
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: 'default'
      - uses: julia-actions/cache@v2
      - name: Verify the JavaScript test runtime
        run: node --version
      - name: Verify the dashboard frontend directly
        run: node --test --test-reporter=tap app/test/frontend_freshness.cjs
      - name: Resolve the package environment
        # resolve() does not bootstrap registries in a fresh Julia depot.
        run: julia --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve(); Pkg.instantiate()'
      - name: Confirm the checkout carries no generated study output
        run: |
          if [ -d validation/output ]; then
            echo "validation/output must not be tracked; the artifact-gated oracles rely on it being absent" >&2
            exit 1
          fi
      - uses: julia-actions/julia-buildpkg@v1
      - name: Verify cold ordinary duration API
        timeout-minutes: 10
        run: julia --startup-file=no --pkgimages=no --threads=1 --project=. test/duration_forcing/cold_public_api.jl
      - name: Verify prospective collector recovery controls
        run: julia --startup-file=no --pkgimages=no --project=. test/test_cme_prospective_monitor.jl
      - name: Verify identifiers across fresh caller processes
        run: julia --startup-file=no --pkgimages=no --project=. test/test_hash_context.jl
      - name: Verify source-bound reference tools
        # Catch filesystem/runtime/schema differences before the full package
        # run. The unfiltered package suite below still executes these tests.
        run: julia --startup-file=no --pkgimages=no --project=. test/test_initial_reference_tools.jl
      - name: Verify source-bound selection import
        run: julia --startup-file=no --pkgimages=no --project=. test/test_initial_reference_import.jl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portable source-bound point input exports
        run: julia --startup-file=no --pkgimages=no --threads=1 --project=. test/point_input_export/runtests.jl
      - name: Retain portable input verification failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-input-${{ matrix.os }}-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solarsindy-point-input-*
          if-no-files-found: ignore
      - name: Verify generated complete static and shared replay comparisons
        run: julia --startup-file=no --pkgimages=no --threads=1 --project=. test/publisher_up_values/source_bound_tests.jl
      - name: Verify frozen models on separately sealed generated future sources
        run: julia --startup-file=no --pkgimages=no --threads=1 --project=. test/publisher_up_values/separate_evaluation_tests.jl
      - name: Retain separate evaluation verification failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: separate-evaluation-${{ matrix.os }}-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solarsindy-separate-evaluation-*
          if-no-files-found: ignore
      - name: Verify independent artifact replay and corruption rejection
        # Standard-library Python and data-only Julia replay; no author model
        # loader, new fitting, network data or scientific acceptance verdict.
        run: |
          REPEAT_COUNT=1
          if [ '${{ matrix.os }}' = ubuntu-latest ] && [ '${{ matrix.julia-version }}' = 1.13.1 ]; then
            REPEAT_COUNT=3
          fi
          if [ '${{ matrix.os }}' = macos-latest ] && [ '${{ matrix.julia-version }}' = 1.13.1 ]; then
            REPEAT_COUNT=3
          fi
          python -B test/initial_reference/run_ci_reader_tests.py --repeat "$REPEAT_COUNT"
      - name: Retain independent reader failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: independent-reference-${{ matrix.os }}-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/initial-reference-reader
          if-no-files-found: ignore
      - name: Verify the generated initial A executor
        run: python -B test/actual_a_chain/run_ci_executor_tests.py
      - name: Retain initial A executor failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: initial-a-executor-${{ matrix.os }}-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/initial-a-chain
          if-no-files-found: ignore
      - name: Verify generated completed-source ridge artifacts
        run: julia --startup-file=no --pkgimages=no --threads=1 --project=. test/completed_refit_artifacts/run_ci_native_chain.jl
      - name: Retain generated ridge failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: completed-ridge-${{ matrix.os }}-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solarsindy-r1-native-*
          if-no-files-found: ignore
      # The suite reports which local-artifact oracles are unavailable in a clean clone.
      - uses: julia-actions/julia-runtest@v1
      - name: Run the research experiments
        run: julia --startup-file=no --project=. examples/experiments.jl
      - name: Retain full package support failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: completed-support-${{ matrix.os }}-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solarsindy-r1-support-log-*
            ${{ runner.temp }}/solarsindy-separate-evaluation-*
          if-no-files-found: ignore

  canonical-harness:
    name: Canonical development harness
    runs-on: ubuntu-latest
    timeout-minutes: 420
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.1'
          arch: 'default'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/cache@v2
      - name: Verify canonical audit wrapper controls
        run: python -B test/completed_refit_artifacts/test_hosted_harness.py
      - name: Instantiate the committed environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.instantiate()'
      - name: Run unchanged canonical audit with full tests and experiments
        run: python -B tools/run_canonical_harness.py --evidence-dir "$RUNNER_TEMP/canonical-harness"
      - name: Retain canonical source proof and every raw verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-harness
          if-no-files-found: error
          compression-level: 6

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@v2
      - name: Instantiate the documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve(); Pkg.instantiate()'
      - name: Build the manual (Julia 1.12.6)
        # Both builds retain the same strict exports, doctests and warning gate.
        run: julia --startup-file=no --project=docs -e 'VERSION == v"1.12.6" || error("unexpected documentation runtime"); include("docs/make.jl")'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - name: Build the manual (Julia 1.13.1)
        # Reuse the already instantiated, portable documentation environment.
        run: julia --startup-file=no --project=docs -e 'VERSION == v"1.13.1" || error("unexpected documentation runtime"); include("docs/make.jl")'

  containers:
    name: Julia 1.12 deployment images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: |
          docker build --tag solarsindy-monitor:ci --file deploy/Dockerfile.monitor .
          docker build --tag solarsindy-dashboard:ci --file app/Dockerfile .
      - name: Load the monitor and frozen artifacts as the runtime user
        run: |
          test "$(docker run --rm solarsindy-monitor:ci id -u)" = 10001
          docker run --rm solarsindy-monitor:ci julia --project=. -e 'using SolarSINDy; include("examples/live_monitor.jl"); @assert length(load_operational_core().coefficients) == 20; @assert isfile("deploy/cmo_ground_shadow/decision.json")'
      - name: Start the dashboard as the runtime user
        run: |
          docker run --detach --name solarsindy-dashboard-ci --publish 127.0.0.1:8723:8723 solarsindy-dashboard:ci
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8723/api/health >/dev/null; then
              ready=1
              break
            fi
            test "$(docker inspect --format '{{.State.Running}}' solarsindy-dashboard-ci)" = true || break
            sleep 2
          done
          docker logs solarsindy-dashboard-ci
          test "$ready" = 1
          test "$(docker exec solarsindy-dashboard-ci id -u)" = 10001
          curl --fail --silent --max-time 5 http://127.0.0.1:8723/ >/dev/null
