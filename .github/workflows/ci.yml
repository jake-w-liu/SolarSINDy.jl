name: CI

# Generated study artifacts are deliberately absent from each clean checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pkg.test — Julia 1.12
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Resolve the package environment
        # resolve() does not bootstrap registries in a fresh Julia depot.
        run: julia --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve(); Pkg.instantiate()'
      - name: Confirm the checkout carries no generated study output
        run: |
          if [ -d validation/output ]; then
            echo "validation/output must not be tracked; the artifact-gated oracles rely on it being absent" >&2
            exit 1
          fi
      - uses: julia-actions/julia-buildpkg@v1
      # The suite reports which local-artifact oracles are unavailable in a clean clone.
      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate the documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve(); Pkg.instantiate()'
      - name: Build the manual
        # `docs/make.jl` runs with checkdocs=:exports, doctest=true and warnonly=false, so this step
        # fails on a missing manual entry or a stale doctest, not only on a broken page.
        run: julia --project=docs docs/make.jl
