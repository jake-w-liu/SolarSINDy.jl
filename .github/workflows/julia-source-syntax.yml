name: Supplemental Julia source syntax

on:
  push:
    branches: [main, codex/acyclic-b-platform-20261109]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  JULIA_NUM_PRECOMPILE_TASKS: '1'
  JULIA_PKG_PRECOMPILE_AUTO: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  syntax:
    name: Source syntax / Julia ${{ matrix.julia-version }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12.6', '1.13.1']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Admit native memory and disk before any Julia launch
        run: bash test/syntax_audit/preflight.sh "$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}"
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: default
      - name: Run independent standard-library syntax controls
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 240s julia --startup-file=no --history-file=no --pkgimages=no --project=@stdlib \
            test/syntax_audit/run_syntax_audit.jl --mode oracles --runtime '${{ matrix.julia-version }}' \
            --output-directory "$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}/oracles" \
            > "$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}/oracles.log" 2>&1
          status=$?
          set -e
          tail -n 40 "$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}/oracles.log"
          exit "$status"
      - name: Parse every tracked Julia source without evaluating it
        run: |
          inventory="$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}/tracked-julia-paths.zlist"
          timeout --signal=TERM --kill-after=20s 60s git ls-files -z -- '*.jl' > "$inventory"
          set +e
          timeout --signal=TERM --kill-after=20s 300s julia --startup-file=no --history-file=no --pkgimages=no --project=@stdlib \
            test/syntax_audit/run_syntax_audit.jl --mode inventory --runtime '${{ matrix.julia-version }}' \
            --output-directory "$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}/inventory" \
            --inventory-file "$inventory" \
            > "$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}/inventory.log" 2>&1
          status=$?
          set -e
          tail -n 40 "$RUNNER_TEMP/julia-source-syntax-${{ matrix.julia-version }}/inventory.log"
          exit "$status"
      - name: Retain supplemental syntax evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-source-syntax-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/julia-source-syntax-${{ matrix.julia-version }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
