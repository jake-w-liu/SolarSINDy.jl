name: Interval workers qualification

on:
  push:
    branches: [codex/acyclic-b-platform-20261109]

# These two supplemental jobs do not replace or extend the locked CI18 jobs.
concurrency:
  group: interval-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workers:
    name: Interval17 / Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12.6', '1.13.1']
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      SOLARSINDY_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          path: science
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: '3.12'
      - name: Admit resources and pin the science checkout before Julia setup
        id: preflight
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -I -B -X utf8 science/tools/actual_b_chain/run_interval_workers_qualification.py \
            --preflight-only --science-checkout "$GITHUB_WORKSPACE/science" \
            --expected-head '${{ github.sha }}' --runtime '${{ matrix.julia-version }}' \
            --evidence-dir "$RUNNER_TEMP/interval-preflight-${{ matrix.julia-version }}"
          receipt="$RUNNER_TEMP/interval-preflight-${{ matrix.julia-version }}/PREFLIGHT.json"
          printf 'sha256=%s\n' "$(sha256sum "$receipt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/setup-julia@v3
        timeout-minutes: 10
        with:
          version: ${{ matrix.julia-version }}
          arch: 'default'
      - uses: julia-actions/cache@v2
        timeout-minutes: 5
      - name: Instantiate without modifying the qualified source
        timeout-minutes: 20
        run: |
          set -euo pipefail
          julia --startup-file=no --threads=1 --project=science -e 'using Pkg; Pkg.Registry.add("General"); Pkg.instantiate()'
          test "$(git -C science rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git -C science status --porcelain=v1 --untracked-files=all)"
      - name: Run the unchanged seventeen workers through the production direct owner
        timeout-minutes: 92
        run: |
          set -euo pipefail
          julia_file="$(command -v julia)"
          python -I -B -X utf8 science/tools/actual_b_chain/run_interval_workers_qualification.py \
            --science-checkout "$GITHUB_WORKSPACE/science" --expected-head '${{ github.sha }}' \
            --runtime '${{ matrix.julia-version }}' --julia "$julia_file" \
            --preflight-record "$RUNNER_TEMP/interval-preflight-${{ matrix.julia-version }}/PREFLIGHT.json" \
            --preflight-sha256 '${{ steps.preflight.outputs.sha256 }}' \
            --evidence-dir "$RUNNER_TEMP/interval-workers-${{ matrix.julia-version }}"
      - name: Preserve the original preflight when a later stage failed
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/interval-preflight-${{ matrix.julia-version }}/PREFLIGHT.json"
          directory="$RUNNER_TEMP/interval-workers-${{ matrix.julia-version }}/artifact/workers17/${{ matrix.julia-version }}"
          if [ -f "$source" ] && [ ! -e "$directory/PREFLIGHT.json" ]; then
            mkdir -p "$directory"
            cp -- "$source" "$directory/PREFLIGHT.json"
          fi
      - name: Retain ordinary original worker evidence including failures
        if: always()
        timeout-minutes: 7
        uses: actions/upload-artifact@v4
        with:
          name: interval-workers-${{ matrix.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interval-workers-${{ matrix.julia-version }}/artifact
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
